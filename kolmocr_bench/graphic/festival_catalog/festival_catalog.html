<!DOCTYPE html>
<html><head>
  <meta charset="utf-8">
  <title>Document</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      color: #333;
    }

    .document {
      max-width: 100%;
      padding: 20px;
      width: 1200px;
    }

    .document.columns-2 {
      column-count: 2;
      column-gap: 2rem;
    }

    .document.columns-3 {
      column-count: 3;
      column-gap: 2rem;
    }

    @media print {

      body,
      .document,
      .block {
        page-break-inside: avoid;
      }
    }

    table,
    table.data-table {
      border-collapse: collapse;
      width: 100%;
      margin: 1rem 0;
      break-inside: avoid;
      border: 1px solid #999;
    }

    table th,
    table td,
    table.data-table th,
    table.data-table td {
      border: 1px solid #999;
      padding: 8px 12px;
      text-align: left;
    }

    table th,
    table.data-table th {
      background-color: #f5f5f5;
      font-weight: bold;
      border: 1px solid #666;
    }

    table tbody tr:nth-child(even),
    table.data-table tbody tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    table tbody tr:hover,
    table.data-table tbody tr:hover {
      background-color: #f0f0f0;
    }

    .math-display {
      display: block;
      margin: 1rem 0;
      overflow-x: auto;
    }

    .math-inline {
      display: inline;
    }

    .block {
      margin: 1rem 0;
      width: fit-content;
    }

    ul,
    ol {
      margin: 0.5rem 0;
      padding-left: 2rem;
    }

    figure {
      margin: 1rem 0;
      text-align: center;
    }

    figure img {
      max-width: 100%;
      height: auto;
    }

    figcaption {
      font-style: italic;
      color: #666;
      margin-top: 0.5rem;
    }

    h1 {
      font-size: 2rem;
      margin: 1.5rem 0 0.5rem 0;
      border-bottom: 2px solid #ddd;
      padding-bottom: 0.3rem;
    }

    h2 {
      font-size: 1.5rem;
      margin: 1.3rem 0 0.4rem 0;
    }

    h3 {
      font-size: 1.2rem;
      margin: 1.1rem 0 0.3rem 0;
    }

    h4,
    h5,
    h6 {
      margin: 1rem 0 0.3rem 0;
    }

    p {
      margin: 0.5rem 0;
    }
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: false,
        processEnvironments: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      },
      svg: {
        fontCache: 'global'
      },
      startup: {
        ready: () => {
          MathJax.startup.defaultReady();
          MathJax.startup.promise.then(() => {
            console.log('MathJax initial rendering complete');
            // Force re-typeset after DOM is fully loaded
            MathJax.typesetPromise().then(() => {
              console.log('MathJax re-typeset complete');
            }).catch((err) => console.log('MathJax typeset error:', err));
          });
        }
      }
    };
  </script>

  <style id="MJX-SVG-styles">
    mjx-container[jax="SVG"] {
      direction: ltr;
    }

    mjx-container[jax="SVG"]>svg {
      overflow: visible;
      min-height: 1px;
      min-width: 1px;
    }

    mjx-container[jax="SVG"]>svg a {
      fill: blue;
      stroke: blue;
    }

    mjx-assistive-mml {
      position: absolute !important;
      top: 0px;
      left: 0px;
      clip: rect(1px, 1px, 1px, 1px);
      padding: 1px 0px 0px 0px !important;
      border: 0px !important;
      display: block !important;
      width: auto !important;
      overflow: hidden !important;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    mjx-assistive-mml[display="block"] {
      width: 100% !important;
    }

    mjx-container[jax="SVG"][display="true"] {
      display: block;
      text-align: center;
      margin: 1em 0;
    }

    mjx-container[jax="SVG"][display="true"][width="full"] {
      display: flex;
    }

    mjx-container[jax="SVG"][justify="left"] {
      text-align: left;
    }

    mjx-container[jax="SVG"][justify="right"] {
      text-align: right;
    }

    g[data-mml-node="merror"]>g {
      fill: red;
      stroke: red;
    }

    g[data-mml-node="merror"]>rect[data-background] {
      fill: yellow;
      stroke: none;
    }

    g[data-mml-node="mtable"]>line[data-line],
    svg[data-table]>g>line[data-line] {
      stroke-width: 70px;
      fill: none;
    }

    g[data-mml-node="mtable"]>rect[data-frame],
    svg[data-table]>g>rect[data-frame] {
      stroke-width: 70px;
      fill: none;
    }

    g[data-mml-node="mtable"]>.mjx-dashed,
    svg[data-table]>g>.mjx-dashed {
      stroke-dasharray: 140;
    }

    g[data-mml-node="mtable"]>.mjx-dotted,
    svg[data-table]>g>.mjx-dotted {
      stroke-linecap: round;
      stroke-dasharray: 0, 140;
    }

    g[data-mml-node="mtable"]>g>svg {
      overflow: visible;
    }

    [jax="SVG"] mjx-tool {
      display: inline-block;
      position: relative;
      width: 0;
      height: 0;
    }

    [jax="SVG"] mjx-tool>mjx-tip {
      position: absolute;
      top: 0;
      left: 0;
    }

    mjx-tool>mjx-tip {
      display: inline-block;
      padding: .2em;
      border: 1px solid #888;
      font-size: 70%;
      background-color: #F8F8F8;
      color: black;
      box-shadow: 2px 2px 5px #AAAAAA;
    }

    g[data-mml-node="maction"][data-toggle] {
      cursor: pointer;
    }

    mjx-status {
      display: block;
      position: fixed;
      left: 1em;
      bottom: 1em;
      min-width: 25%;
      padding: .2em .4em;
      border: 1px solid #888;
      font-size: 90%;
      background-color: #F8F8F8;
      color: black;
    }

    foreignObject[data-mjx-xml] {
      font-family: initial;
      line-height: normal;
      overflow: visible;
    }

    mjx-container[jax="SVG"] path[data-c],
    mjx-container[jax="SVG"] use[data-c] {
      stroke-width: 3;
    }
  </style>
