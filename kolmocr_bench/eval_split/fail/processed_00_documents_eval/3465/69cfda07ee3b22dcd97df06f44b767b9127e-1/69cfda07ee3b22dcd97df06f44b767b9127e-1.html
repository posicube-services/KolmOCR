<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8"/>
<title>Document</title>
<style>

:root {
--font-scale: 1;
--base-font-size: 10pt;
--body-font-size: max(5px, calc(var(--base-font-size) * var(--font-scale)));
}

.document {
width: 210mm;
margin: 0 auto;
padding: 15mm 20mm;
box-sizing: border-box;
background: #fff;
column-count: 1;
column-gap: 10mm;
column-fill: balance;
overflow: visible;
transform: none;
font-size: var(--body-font-size);
}



:root {
  --font-scale: 1;
  --base-font-size: calc(10pt * var(--font-scale));
  --body-font-size: max(5px, calc(var(--base-font-size) * var(--font-scale)));
}



/* Block b001: Markdown Title */
[data-id="b001"] h1 {
  font-size: calc(1.5em * var(--font-scale));
  font-weight: bold;
  margin: 0 0 10px 0;
  border-bottom: 1px solid #ccc;
  padding-bottom: 5px;
  color: #333;
}

/* Block b002: 문제 Header */
[data-id="b002"] h2 {
  font-size: calc(1.2em * var(--font-scale));
  font-weight: bold;
  margin: 20px 0 10px 0;
  color: #222;
}

/* Block b003: Problem List */
[data-id="b003"] ol {
  margin: 10px 0;
  padding-left: 20px;
  font-size: calc(1em * var(--font-scale));
  line-height: 1.5;
  color: #333;
}

[data-id="b003"] li {
  margin: 5px 0;
}

/* Block b004: Solution Header */
[data-id="b004"] h2 {
  font-size: calc(1.2em * var(--font-scale));
  font-weight: bold;
  margin: 20px 0 10px 0;
  color: #222;
}

/* Block b005: Table */
[data-id="b005"] .table-container {
  margin: 15px 0;
  border: 1px solid #ddd;
  border-collapse: collapse;
  width: 100%;
}

[data-id="b005"] .data-table {
  width: 100%;
  border-collapse: collapse;
}

[data-id="b005"] .data-table th,
[data-id="b005"] .data-table td {
  border: 1px solid #ccc;
  padding: 8px 12px;
  text-align: center;
  font-size: calc(0.9em * var(--font-scale));
}

[data-id="b005"] .data-table th {
  background-color: #f2f2f2;
  font-weight: bold;
}

[data-id="b005"] .data-table tbody tr:nth-child(even) {
  background-color: #f9f9f9;
}

[data-id="b005"] .data-table tbody tr:hover {
  background-color: #f0f0f0;
}



/* Enforce title/author to body ratio and minimum readable size */
.block[data-class="title"],
.block[data-class="author"] {
font-size: clamp(5px, calc(var(--body-font-size) * 1.4), 999px);
}
.block[data-class]:not([data-class="title"]):not([data-class="author"]) {
font-size: clamp(5px, var(--body-font-size), 999px);
}



                /* Target table blocks specifically */
                .block[data-class="table"],
                .block[data-class*="table"] {
                    column-span: all !important;
                    -webkit-column-span: all !important;
                    display: block !important;
                    margin: 2rem 0 !important;
                    padding: 0.01rem !important;
                    background: transparent !important;
                    border: none !important;
                    border-radius: 4px !important;
                }

                .block[data-class="table"] .table-container,
                .block[data-class*="table"] .table-container {
                    display: block !important;
                    width: 100% !important;
                    overflow-x: auto !important;
                    min-height: 50px !important;
                    position: static !important;
                }

                @media print {
                    .block[data-class="table"] .table-container,
                    .block[data-class*="table"] .table-container {
                        overflow-x: visible !important;
                        overflow-y: visible !important;
                    }
                }

                .block[data-class="table"] table,
                .block[data-class*="table"] table {
                    width: 100% !important;
                    display: table !important;
                    table-layout: auto !important;
                    border-collapse: collapse !important;
                    border-spacing: 0 !important;

                .block[data-class="table"] td,

                    background: #fff !important;

                .block[data-class="table"] th,

                    background: #e8e8e8 !important;

                .block[data-class="table"] tr:nth-child(even),

                .block[data-class="table"],
