<!DOCTYPE html>

<style>

:root {
--font-scale: 1;
--base-font-size: 10pt;
--body-font-size: max(5px, calc(var(--base-font-size) * var(--font-scale)));
}

.document {
width: 210mm;
margin: 0 auto;
padding: 15mm 20mm;
box-sizing: border-box;
background: #fff;
column-count: 1;
column-gap: 10mm;
column-fill: balance;
overflow: visible;
transform: none;
font-size: var(--body-font-size);
}



:root {
  --font-scale: 1;
  --base-font-size: calc(10pt * var(--font-scale));
  --body-font-size: max(5px, calc(var(--base-font-size) * var(--font-scale)));
}



/* Block b001: Question text */
[data-id="b001"] {
  margin-bottom: 20px;
  font-family: sans-serif;
  line-height: 1.6;
  color: #333;
}

[data-id="b001"] ol {
  padding-left: 20px;
  list-style-type: decimal;
}

[data-id="b001"] li {
  margin-bottom: 10px;
  font-size: calc(1em * var(--font-scale));
}

/* Block b002: Image */
[data-id="b002"] {
  text-align: center;
  margin: 30px 0;
}

[data-id="b002"] figure {
  display: inline-block;
  max-width: 100%;
  height: auto;
  border: 1px solid #ddd;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

[data-id="b002"] img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 8px;
}

/* General image styling */
img {
  max-width: 100%;
  height: auto;
}



/* Enforce title/author to body ratio and minimum readable size */
.block[data-class="title"],
.block[data-class="author"] {
font-size: clamp(5px, calc(var(--body-font-size) * 1.4), 999px);
}
.block[data-class]:not([data-class="title"]):not([data-class="author"]) {
font-size: clamp(5px, var(--body-font-size), 999px);
}



                /* Target table blocks specifically */
                .block[data-class="table"],
                .block[data-class*="table"] {
                    column-span: all !important;
                    -webkit-column-span: all !important;
                    display: block !important;
                    margin: 2rem 0 !important;
                    padding: 0.40rem !important;
                    background: transparent !important;
                    border: 1px solid #f0f0f0 !important;
                    border-radius: 4px !important;
                }

                .block[data-class="table"] .table-container,
                .block[data-class*="table"] .table-container {
                    display: block !important;
                    width: 100% !important;
                    overflow-x: auto !important;
                    min-height: 50px !important;
                    position: static !important;
                }

                @media print {
                    .block[data-class="table"] .table-container,
                    .block[data-class*="table"] .table-container {
                        overflow-x: visible !important;
                        overflow-y: visible !important;
                    }
                }

                .block[data-class="table"] table,
                .block[data-class*="table"] table {
                    width: 100% !important;
                    display: table !important;
                    table-layout: auto !important;
                    border-collapse: collapse !important;
                    border-spacing: 0 !important;
                    min-height: 40px !important;
                    position: static !important;
                }

                .block[data-class="table"] td,
                .block[data-class="table"] th,
                .block[data-class*="table"] td,
                .block[data-class*="table"] th {
                    padding: 6px 10px !important;
                    border: 1.5px solid #000 !important;
                    min-height: 1.5em !important;
                    line-height: 1.4 !important;
                    position: static !important;
                    color: #000 !important;
                    background: #fff !important;
                }

                .block[data-class="table"] th,
                .block[data-class*="table"] th {
                    background: #e0e0e0 !important;
                    font-weight: bold !important;
                }
                
                .block[data-class="table"] tr:nth-child(even),
                .block[data-class*="table"] tr:nth-child(even) {
                    background: #fcfcfc !important;
                }

                .block[data-class="table"],
                .block[data-class*="table"] {
                    overflow: visible !important;
                }
