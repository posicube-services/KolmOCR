.document {

:root {
  --font-scale: 1;
  --base-font-size: calc(10pt * var(--font-scale));
  --body-font-size: max(5px, calc(var(--base-font-size) * var(--font-scale)));
}



/* Block b001: Plain text paragraph */
[data-id="b001"] {
  font-family: sans-serif;
  font-size: calc(1em * var(--font-scale));
  line-height: 1.5;
  color: #333;
  margin-bottom: 10px;
}

/* Block b002: Table of Contents heading */
[data-id="b002"] h2 {
  font-family: '은 궁서', Tahoma, Geneva, Verdana, sans-serif;
  font-size: calc(1.5em * var(--font-scale));
  font-weight: bold;
  color: #2c3e50;
  margin: 20px 0 10px 0;
  border-bottom: 3px solid #3498db;
  padding-bottom: 5px;
}

/* Block b003: Table container and styling */
[data-id="b003"] .table-container {
  width: 100%;
  overflow: auto;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
  margin: 20px 0;
}

[data-id="b003"] .data-table {
  width: 100%;
  border-collapse: collapse;
  font-family: sans-serif;
  font-size: calc(1em * var(--font-scale));
  color: #333;
}

[data-id="b003"] .data-table th {
  background-color: #3498db;
  color: white;
  padding: 10px 15px;
  text-align: center;
  font-weight: bold;
  border: 1px solid #bdc3c7;
}

[data-id="b003"] .data-table td {
  padding: 10px 15px;
  text-align: center;
  border: 1px solid #ecf0f1;
  background-color: #f9fbfd;
}

[data-id="b003"] .data-table tr:nth-child(even) td {
  background-color: #f2f8fc;
}

[data-id="b003"] .data-table tr:last-child td {
  border-bottom: none;
}

[data-id="b003"] .data-table tr td:first-child {
  text-align: left;
}

[data-id="b003"] .data-table tr td:last-child {
  text-align: center;
}

/* Optional: Add hover effect for table rows */
[data-id="b003"] .data-table tbody tr:hover td {
  background-color: #e8f4fc;
  transition: background-color 0.2s ease;
}



/* Enforce title/author to body ratio and minimum readable size */
.block[data-class="title"],
.block[data-class="author"] {
font-size: clamp(5px, calc(var(--body-font-size) * 1.4), 999px);
}
.block[data-class]:not([data-class="title"]):not([data-class="author"]) {
font-size: clamp(5px, var(--body-font-size), 999px);
}



                /* Target table blocks specifically */
