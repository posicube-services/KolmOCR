:root {
--font-scale: 1;
--base-font-size: 10pt;

}

.document {
width: 210mm;
margin: 0 auto;
padding: 15mm 20mm;
box-sizing: border-box;
background: #fff;
column-count: 1;
column-gap: 10mm;
column-fill: balance;
overflow: visible;
transform: none;
font-size: var(--body-font-size);
}



:root {
  --font-scale: 1;
  --base-font-size: calc(10pt * var(--font-scale));
  --body-font-size: max(5px, calc(var(--base-font-size) * var(--font-scale)));
}



/* Block-specific styles */
.block[data-id="b001"] {
  margin: 10px 0;
  padding: 10px;
  border-left: 4px solid #007bff;
  background-color: #f8f9fa;
  border-radius: 4px;
  line-height: 1.6;
  font-family: -apple-system, BlinkMacSystemFont, "은 궁서", 맑은 고딕, "맑은 고딕", Arial, sans-serif;
}

.block[data-id="b001"] p {
  margin: 0;
  color: #212529;
  font-size: calc(1em * var(--font-scale));
}

/* Ensure consistent spacing and readability */
.block[data-id="b001"] br {
  display: block;
  margin: 10px 0;
}



/* Enforce title/author to body ratio and minimum readable size */
.block[data-class="title"],
.block[data-class="author"] {
font-size: clamp(5px, calc(var(--body-font-size) * 1.4), 999px);
}
.block[data-class]:not([data-class="title"]):not([data-class="author"]) {
font-size: clamp(5px, var(--body-font-size), 999px);
}



                /* Target table blocks specifically */
                .block[data-class="table"],
                .block[data-class*="table"] {
                    column-span: all !important;
                    -webkit-column-span: all !important;
                    display: block !important;
                    margin: 2rem 0 !important;
                    padding: 0.41rem !important;
                    background: transparent !important;
                    border: none !important;
                    border-radius: 4px !important;
                }

                .block[data-class="table"] .table-container,
                .block[data-class*="table"] .table-container {
                    display: block !important;
                    width: 100% !important;
                    overflow-x: auto !important;
                    min-height: 50px !important;
                    position: static !important;
                }

                @media print {
                    .block[data-class="table"] .table-container,
                    .block[data-class*="table"] .table-container {
                        overflow-x: visible !important;
                        overflow-y: visible !important;
                    }
                }

                .block[data-class="table"] table,
                .block[data-class*="table"] table {
                    width: 100% !important;
                    display: table !important;
                    table-layout: auto !important;
                    border-collapse: collapse !important;
                    border-spacing: 0 !important;
                    min-height: 40px !important;
                    position: static !important;
                }

                .block[data-class="table"] td,
                .block[data-class="table"] th,
                .block[data-class*="table"] td,
                .block[data-class*="table"] th {
                    padding: 8px 10px !important;
                    border: 1.5px solid #000 !important;
                    min-height: 1.5em !important;
                    line-height: 1.4 !important;
                    position: static !important;
                    color: #000 !important;
                    background: #fff !important;
                }

                .block[data-class="table"] th,
                .block[data-class*="table"] th {
                    background: #f8f8f8 !important;
                    font-weight: bold !important;
                }
                
                .block[data-class="table"] tr:nth-child(even),
                .block[data-class*="table"] tr:nth-child(even) {
                    background: #fafafa !important;
                }

                .block[data-class="table"],
                .block[data-class*="table"] {
                    overflow: visible !important;
                }

<p>이미지가 너무 크고, 일부 텍스트가 잘 읽기 어렵습니다. 이를 분석하기 위해, 이미지를 스캔하여 텍스트를 추출할 수 있습니다. 그러면 markdown 형식으로 구조화할 수 있을 것 같습니다. 먼저, 이미지를 스캔하여 텍스트를 추출한 후에 다시 질문해 주세요.<br/>
하지만 이미지에 대한 구체적인 내용을 제공해주시면, 해당 부분에 대해 더 자세히 설명하거나 필요한 부분을 추출해드릴 수 있습니다. 예를 들어, 특정 논문이나 항목에 대해 더 자세히 알고 싶으시다면, 해당 항목의 번호를 알려주세요.</p>
