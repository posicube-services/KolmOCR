<style>

:root {
--font-scale: 1;
--base-font-size: 10pt;
--body-font-size: max(5px, calc(var(--base-font-size) * var(--font-scale)));
}

.document {
width: 210mm;
margin: 0 auto;
padding: 15mm 20mm;
box-sizing: border-box;
background: #fff;
column-count: 1;
column-gap: 10mm;
column-fill: balance;
overflow: visible;
transform: none;
font-size: var(--body-font-size);
}



:root {
  --font-scale: 1;
  --base-font-size: calc(10pt * var(--font-scale));
  --body-font-size: max(5px, calc(var(--base-font-size) * var(--font-scale)));
}



/* Block b001: Title */
[data-id="b001"] h1 {
  font-size: calc(1.5em * var(--font-scale));
  font-weight: bold;
  color: #2c3e50;
  border-bottom: 2px solid #2c3e50;
  padding-bottom: 5px;
  margin-top: 0;
  margin-bottom: 15px;
}

/* Block b002: Table Heading */
[data-id="b002"] h2 {
  font-size: calc(1.2em * var(--font-scale));
  font-weight: bold;
  color: #34495e;
  margin-top: 20px;
  margin-bottom: 10px;
}

/* Block b003: Table Styling */
[data-id="b003"] .table-container {
  width: 100%;
  overflow: auto;
  margin-bottom: 20px;
}

[data-id="b003"] .data-table {
  width: 100%;
  border-collapse: collapse;
  margin: 0;
  border: 1px solid #ddd;
}

[data-id="b003"] .data-table th,
[data-id="b003"] .data-table td {
  padding: 8px 12px;
  text-align: left;
  border: 1px solid #ddd;
}

[data-id="b003"] .data-table th {
  background-color: #f2f2f2;
  font-weight: bold;
  color: #333;
}

[data-id="b003"] .data-table tbody tr:nth-child(even) {
  background-color: #f9f9f9;
}

/* Block b004: Image Heading */
[data-id="b004"] h2 {
  font-size: calc(1.2em * var(--font-scale));
  font-weight: bold;
  color: #34495e;
  margin-top: 20px;
  margin-bottom: 10px;
}

/* Block b005: Image with Bounding Box */
[data-id="b005"] img {
  width: 100%;
  height: auto;
  border: 1px solid #ccc;
  border-radius: 4px;
  display: block;
  margin: 10px 0;
}

[data-id="b005"] p {
  font-size: calc(0.9em * var(--font-scale));
  color: #7f8c8d;
  margin: 5px 0;
  font-style: italic;
}

/* General heading styles for consistency */
h1, h2 {
  margin: 0;
  padding: 0;
}

/* Ensure consistent spacing between blocks */
.block + .block {
  margin-top: 20px;
}



/* Enforce title/author to body ratio and minimum readable size */
.block[data-class="title"],
.block[data-class="author"] {
font-size: clamp(5px, calc(var(--body-font-size) * 1.4), 999px);
}
.block[data-class]:not([data-class="title"]):not([data-class="author"]) {
font-size: clamp(5px, var(--body-font-size), 999px);
}



                /* Target table blocks specifically */
                .block[data-class="table"],
