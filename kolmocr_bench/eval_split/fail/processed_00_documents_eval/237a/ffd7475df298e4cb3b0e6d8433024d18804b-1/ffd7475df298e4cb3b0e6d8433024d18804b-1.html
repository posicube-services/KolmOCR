/* Block b001: yaml */

  padding: 0;
  font-style: italic;
  font-family: "은 필기", serif;
}

/* Block b005: Table */
[data-id="b005"] .table-container {
  border: 1px solid #ccc;
  border-collapse: collapse;
  width: 100%;
  margin: 10px 0;
}

[data-id="b005"] .data-table {
  width: 100%;
  border-collapse: collapse;
}

[data-id="b005"] .data-table tr {
  border-bottom: 1px solid #ddd;
}

[data-id="b005"] .data-table td {
  padding: 8px;
  text-align: left;
  font-size: calc(0.9em * var(--font-scale));
  color: #333;
  border: none;
}

[data-id="b005"] .data-table tr:last-child td {
  border-bottom: none;
}

[data-id="b005"] .data-table tr:nth-child(odd) td {
  background-color: #f9f9f9;
}

[data-id="b005"] .data-table tr:nth-child(even) td {
  background-color: #fff;
}



/* Enforce title/author to body ratio and minimum readable size */
.block[data-class="title"],
.block[data-class="author"] {
font-size: clamp(5px, calc(var(--body-font-size) * 1.4), 999px);
}
.block[data-class]:not([data-class="title"]):not([data-class="author"]) {
font-size: clamp(5px, var(--body-font-size), 999px);
}
