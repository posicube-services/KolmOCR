<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8"/>
<title>Document</title>
<style>

:root {
--font-scale: 1;
--base-font-size: 10pt;
--body-font-size: max(5px, calc(var(--base-font-size) * var(--font-scale)));
}

.document {
width: 210mm;
margin: 0 auto;
padding: 15mm 20mm;
box-sizing: border-box;
background: #fff;
column-count: 1;
column-gap: 10mm;
column-fill: balance;
overflow: visible;
transform: none;
font-size: var(--body-font-size);
}



:root {
  --font-scale: 1;
  --base-font-size: calc(10pt * var(--font-scale));
  --body-font-size: max(5px, calc(var(--base-font-size) * var(--font-scale)));
}



/* Block b001: Table */
.block[data-id="b001"] {
  margin-bottom: 10mm;
}

.block[data-id="b001"] .table-container {
  width: 100%;
  border-collapse: collapse;
  margin: 10px 0;
}

.block[data-id="b001"] .data-table th,
.block[data-id="b001"] .data-table td {
  border: 1px solid #ccc;
  padding: 8px;
  text-align: left;
}

.block[data-id="b001"] .data-table th {
  background-color: #e0e0e0;
  font-weight: bold;
}

.block[data-id="b001"] .data-table tbody tr:nth-child(even) {
  background-color: #f9f9f9;
}

/* Block b002: Code block */
.block[data-id="b002"] {
  margin: 10mm 0;
  background-color: #f5f5f5;
  border: 1px solid #ddd;
  border-radius: 4px;
  padding: 10px;
  overflow-x: auto;
}

.block[data-id="b002"] pre {
  margin: 0;
  font-family: monospace;
  font-size: calc(0.9em * var(--font-scale));
  color: #333;
}

.block[data-id="b002"] code {
  display: block;
  white-space: pre;
  word-break: break-all;
}

/* Block b003: Paragraph with HTML tags */
.block[data-id="b003"] {
  margin-top: 10mm;
  font-size: calc(0.9em * var(--font-scale));
  color: #555;
}

.block[data-id="b003"] p {
  margin: 0;
  line-height: 1.5;
}

.block[data-id="b003"] p::before {
  content: "⭐ ";
  color: #e63946;
  font-weight: bold;
}



/* Enforce title/author to body ratio and minimum readable size */
.block[data-class="title"],
.block[data-class="author"] {
font-size: clamp(5px, calc(var(--body-font-size) * 1.4), 999px);
}
.block[data-class]:not([data-class="title"]):not([data-class="author"]) {
font-size: clamp(5px, var(--body-font-size), 999px);
}



                /* Target table blocks specifically */
                .block[data-class="table"],
                .block[data-class*="table"] {
                    column-span: all !important;
                    -webkit-column-span: all !important;
                    display: block !important;
                    margin: 2rem 0 !important;
                    padding: 0.10rem !important;
                    background: rgba(245, 245, 245, 0.2) !important;
                    border: none !important;
                    border-radius: 4px !important;
                }

                .block[data-class="table"] .table-container,
                .block[data-class*="table"] .table-container {
                    display: block !important;
                    width: 100% !important;
                    overflow-x: auto !important;
                    min-height: 50px !important;
                    position: static !important;
                }

                @media print {
                    .block[data-class="table"] .table-container,
                    .block[data-class*="table"] .table-container {
                        overflow-x: visible !important;
                        overflow-y: visible !important;
                    }
                }

                .block[data-class="table"] table,
                .block[data-class*="table"] table {
                    width: 100% !important;
                    display: table !important;
                    table-layout: auto !important;
                    border-collapse: collapse !important;
                    min-height: 40px !important;
                    position: static !important;
                }

                .block[data-class="table"] td,
                .block[data-class="table"] th,
                .block[data-class*="table"] td,
                .block[data-class*="table"] th {
                    padding: 5px 7px !important;
                    border: none !important;
                    border-bottom: 1px solid #ddd !important;
                    min-height: 1.5em !important;
                    line-height: 1.4 !important;
                    position: static !important;
                    color: #000 !important;
                    background: #fff !important;
                }

                .block[data-class="table"] th,
                .block[data-class*="table"] th {
                    background: #f5f5f5 !important;
                    font-weight: bold !important;
                }
                
                .block[data-class="table"] tr:nth-child(even),
                .block[data-class*="table"] tr:nth-child(even) {
                    background: #fcfcfc !important;
                }

                .block[data-class="table"],
                .block[data-class*="table"] {
                    overflow: visible !important;
                }

                .block[data-class="table"] td,

                .block[data-class*="table"] th {

                .block[data-class="table"] th,

</style>
</head>
