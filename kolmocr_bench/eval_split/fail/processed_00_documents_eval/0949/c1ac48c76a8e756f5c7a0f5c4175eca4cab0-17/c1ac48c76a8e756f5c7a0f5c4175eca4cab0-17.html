<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8"/>
<title>Document</title>
<style>

:root {
--font-scale: 1;
--base-font-size: 10pt;
--body-font-size: max(5px, calc(var(--base-font-size) * var(--font-scale)));
}

.document {
width: 210mm;
margin: 0 auto;
padding: 15mm 20mm;
box-sizing: border-box;
background: #fff;
column-count: 1;
column-gap: 10mm;
column-fill: balance;
overflow: visible;
transform: none;
font-size: var(--body-font-size);
}



:root {
  --font-scale: 1;
  --base-font-size: calc(10pt * var(--font-scale));
  --body-font-size: max(5px, calc(var(--base-font-size) * var(--font-scale)));
}



/* Block b001: Title "markdown" */
[data-id="b001"] h1 {
  font-size: calc(1.5em * var(--font-scale));
  margin: 0 0 1em 0;
  font-weight: bold;
  border-bottom: 1px solid #ccc;
  padding-bottom: 0.5em;
}

/* Block b002: Table content */
[data-id="b002"] p {
  font-family: monospace;
  font-size: calc(0.9em * var(--font-scale));
  line-height: 1.5;
  margin: 1em 0;
  white-space: pre-wrap;
  border-bottom: 1px solid #ccc;
  padding-bottom: 0.5em;
}

/* Ensure table-like alignment in pre-wrap */
[data-id="b002"] p::before {
  content: "";
  display: table;
  clear: both;
}

[data-id="b002"] p br {
  content: "\A";
  white-space: pre;
}



/* Enforce title/author to body ratio and minimum readable size */
.block[data-class="title"],
.block[data-class="author"] {
font-size: clamp(5px, calc(var(--body-font-size) * 1.4), 999px);
}
.block[data-class]:not([data-class="title"]):not([data-class="author"]) {
font-size: clamp(5px, var(--body-font-size), 999px);
}



                /* Target table blocks specifically */
                .block[data-class="table"],
                .block[data-class*="table"] {
                    column-span: all !important;
                    -webkit-column-span: all !important;
                    display: block !important;
                    margin: 2rem 0 !important;
                    padding: 0.09rem !important;
                    background: rgba(248, 248, 248, 0.3) !important;
                    border: none !important;
                    border-radius: 4px !important;
                }

                .block[data-class="table"] .table-container,
                .block[data-class*="table"] .table-container {
                    display: block !important;
                    width: 100% !important;
                    overflow-x: auto !important;
                    min-height: 50px !important;
                    position: static !important;
                }

                @media print {
                    .block[data-class="table"] .table-container,
                    .block[data-class*="table"] .table-container {
                        overflow-x: visible !important;
                        overflow-y: visible !important;
                    }
                }

                .block[data-class="table"] table,
                .block[data-class*="table"] table {
                    width: 100% !important;
                    display: table !important;
                    table-layout: auto !important;
                    border-collapse: collapse !important;
                    border-spacing: 0 !important;
                    min-height: 40px !important;
                    position: static !important;
                }

                .block[data-class="table"] td,
                .block[data-class="table"] th,
                .block[data-class*="table"] td,
                .block[data-class*="table"] th {
                    padding: 8px 10px !important;
                    border: 1px solid #ccc !important;
                    min-height: 1.5em !important;
                    line-height: 1.4 !important;
                    position: static !important;
                    color: #000 !important;
                    background: #fff !important;
                }

                .block[data-class="table"] th,
                .block[data-class*="table"] th {
                    background: #e8e8e8 !important;
                    font-weight: bold !important;
                }
                
                .block[data-class="table"] tr:nth-child(even),
                .block[data-class*="table"] tr:nth-child(even) {
                    background: #fafafa !important;
                }

                .block[data-class="table"],
                .block[data-class*="table"] {
                    overflow: visible !important;
                }
                

body {

                .block[data-class="table"] td,

                .block[data-class*="table"] th {

                .block[data-class="table"] th,

</style>
