# Example OlmOCR Training Configuration with Torch Compile

# Project metadata
project_name: olmocr-qwen-vl-training
run_name: qwen2.5-vl-7b-olmocrv4_1epoch_ko_mix1223

# Model configuration
model:
  name: /my_home/checkpoints/qwen2.5-vl-7b-olmocrv4_1epoch_promptv4_mix1025_more_rotation_filtered/checkpoint-16743
  tokenizer_name: /my_home/olmocr-qwen2.5-vl-7b-1epoch-mix1215/qwen2.5-vl-7b-olmocrv4_1epoch_ko_mix1215/checkpoint-3061
  trust_remote_code: true
  torch_dtype: bfloat16
  device_map: null # Set to null for distributed training, accelerator handles device placement
  use_flash_attention: true
  attn_implementation: flash_attention_2

  # LoRA settings (disabled by default)
  use_lora: false
  # lora_rank: 8
  # lora_alpha: 32
  # lora_dropout: 0.1
  # lora_target_modules:
