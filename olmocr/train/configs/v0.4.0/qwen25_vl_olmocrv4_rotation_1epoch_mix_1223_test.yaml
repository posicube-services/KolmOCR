  #   - v_proj
  #   - k_proj
  #   - o_proj
pipelines:
  doc_synth_pipeline: &doc_synth_pipeline
  - name: FrontMatterParser
    front_matter_class: PageResponse
    verbose: false # Disable to reduce logging overhead
  - name: FilterOutRotatedDocuments
    verbose: false # Disable to reduce logging overhead
  - name: ReformatLatexBoldItalic
  - name: DatasetTextRuleFilter
    verbose: false # Disable to reduce logging overhead
  - name: PDFRenderer
    target_longest_image_dim: 1288 # Reduced from 1288 for faster processing
    verbose: false # Disable to reduce logging overhead
  - name: RotationAugmentation
    probability: 0.02
  - name: FinetuningPrompt
    prompt_func: build_no_anchoring_v4_yaml_prompt_with_bbox_wo_frontmatter
  - name: NoFrontMatterOutputFormat
  - name: InstructUserMessages
    prompt_first: true
  - name: Tokenizer
    masking_index: -100
    end_of_message_token: "<|im_end|>"


  doc_synth_pipeline_wo_bbox: &doc_synth_pipeline_wo_bbox
  - name: FrontMatterParser
    front_matter_class: PageResponse
    verbose: false # Disable to reduce logging overhead
  - name: FilterOutRotatedDocuments
    verbose: false # Disable to reduce logging overhead
  - name: ReformatLatexBoldItalic
  - name: DatasetTextRuleFilter
    verbose: false # Disable to reduce logging overhead
  - name: PDFRenderer
    target_longest_image_dim: 1288 # Reduced from 1288 for faster processing
    verbose: false # Disable to reduce logging overhead
  - name: RotationAugmentation
    probability: 0.02
  - name: FinetuningPrompt
    prompt_func: build_no_anchoring_v4_yaml_prompt_wo_frontmatter
  - name: NoFrontMatterOutputFormat
  - name: InstructUserMessages
    prompt_first: true
  - name: Tokenizer
    masking_index: -100
    end_of_message_token: "<|im_end|>"

