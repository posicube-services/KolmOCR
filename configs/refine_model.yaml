# Default config for running vLLM-based Qwen2.5-VL inference.
model: Qwen/Qwen2.5-VL-7B-Instruct
api_base: "http://localhost:8000/v1"
api_key: "EMPTY" # vLLM 기본 server면 dummy 값으로 둡니다.
input_dir: kolmocr_bench/table
output_dir: output/kolmocr_bench_vllm/table
prompt: "이미지가 원본 문서야. 이미지 문서의 언어와 HTML 문서의 언어가 다른건 무시해. 원본 이미지 문서와 HTML 문서의 layout을 확인하고, HTML 문서의 layout이 원본 이미지 문서의 layout을 따라가도록 HTML을 수정해줘. 출력 결과물은 설명없이 수정된 전체 HTML 코드만 주면 돼."
max_new_tokens: 4000
temperature: 0.7
top_p: 0.9
num_workers: 2
max_model_len: 16000
# GPU 설정: CUDA_VISIBLE_DEVICES 환경 변수에 따라 조정
tensor_parallel_size: 1 # 기본값 1, 사용할 GPU 개수에 맞춰 조정
gpu_memory_utilization: 0.9
