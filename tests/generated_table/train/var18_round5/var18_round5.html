<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>외화수취통지서</title>
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 12pt;
      color: #111;
      background-color: #fff;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 15px;
      font-size: 18pt;
      font-weight: bold;
    }
    .document-container {
      max-width: 100%;
      background: #999;
      padding: 20px;
      border-radius: 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      margin-bottom: 20px;
      background: #999;
      border: none;
    }
    th, td {
      padding: 8px;
      text-align: left;
      border: none;
      vertical-align: top;
      word-break: break-all;
      white-space: normal;
    }
    th {
      color: #fff;
      font-weight: normal;
      font-size: 11pt;
    }
    td {
      background: #e8e8e8;
      font-size: 12pt;
      font-weight: bold;
      text-align: right;
    }
    .section-header {
      font-weight: bold;
      text-align: center;
      background: #999;
      color: #fff;
      padding: 6px;
      margin-top: 10px;
      margin-bottom: 5px;
      font-size: 11pt;
    }
    .sub-header {
      font-weight: normal;
      text-align: center;
      background: #999;
      color: #fff;
      padding: 4px;
      font-size: 10pt;
    }
    .field-label {
      font-weight: bold;
      color: #fff;
      text-align: left;
      padding-right: 5px;
    }
    .field-value {
      background: #e8e8e8;
      padding: 4px 8px;
      border-bottom: 1px dashed #bbb;
      font-weight: bold;
      text-align: right;
    }
    .two-column {
      display: flex;
      gap: 20px;
    }
    .column {
      flex: 1;
    }
    .table-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 5px;
    }
    .table-cell {
      display: flex;
      flex-direction: column;
      width: 48%;
    }
    .table-cell-label {
      font-weight: bold;
      color: #fff;
      margin-bottom: 2px;
      font-size: 11pt;
    }
    .table-cell-value {
      background: #e8e8e8;
      padding: 4px 8px;
      border-bottom: 1px dashed #bbb;
      font-weight: bold;
      text-align: right;
      font-size: 12pt;
    }
    .multi-line {
      display: flex;
      flex-direction: column;
    }
    .multi-line-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
    }
    .multi-line-label {
      font-weight: bold;
      color: #fff;
      font-size: 11pt;
      width: 30%;
    }
    .multi-line-value {
      background: #e8e8e8;
      padding: 2px 5px;
      border-bottom: 1px dashed #bbb;
      font-weight: bold;
      text-align: right;
      font-size: 12pt;
      width: 70%;
    }
    .transaction-table {
      width: 100%;
      margin-top: 10px;
      background: #e8e8e8;
      border: 1px solid #bbb;
    }
    .transaction-header {
      background: #999;
      color: #fff;
      padding: 4px;
      text-align: center;
      font-weight: bold;
      font-size: 10pt;
    }
    .transaction-row {
      display: flex;
      justify-content: space-between;
      padding: 4px;
      border-bottom: 1px dashed #bbb;
    }
    .transaction-col {
      width: 25%;
      text-align: right;
      font-size: 11pt;
    }
    .signature-section {
      margin-top: 20px;
    }
  </style>
</head>
